# Anatol-X Custom GRUB Colors and Settings
GRUB_DISTRIBUTOR="Anatol-X"
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="black/cyan"
GRUB_TIMEOUT=5
GRUB_GFXMODE=1920x1080,1366x768,1024x768,800x600,auto
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash mitigations=off zswap.enabled=1 zswap.compressor=lz4"
GRUB_DISABLE_OS_PROBER=false
GRUB_BACKGROUND=/usr/share/backgrounds/anatolx/grub-splash.png
