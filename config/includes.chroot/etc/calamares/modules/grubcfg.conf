---
# Anatol-X grubcfg: kurulu sistemin /etc/default/grub ayarları
# Mevcut /etc/default/grub düzenlenir; 99-anatolx-grub.cfg korunur.
overwrite: false
keep_distributor: false
kernel_params: []

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
