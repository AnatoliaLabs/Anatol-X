name: Anatol-X ISO Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Disk Alanı Aç
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Gerekli Paketleri Kur
        run: |
          sudo apt update
          # debian-archive-keyring paketi eklendi
          sudo apt install -y debootstrap curl git make gettext po4a rsync debian-archive-keyring
          git clone https://salsa.debian.org/live-team/live-build.git
          cd live-build
          sudo make install
   
      - name: Görselleri Konfigürasyona Dağıt
        run: |
          mkdir -p config/includes.chroot/etc/calamares/branding/anatolx/
          mkdir -p config/includes.chroot/usr/share/backgrounds/anatolx/
          mkdir -p config/includes.chroot/usr/share/pixmaps/
          
          # 1. Calamares Hoş Geldin Görseli (.png)
          cp assets/ResizedImage_2026-07-06_15-11-10_3092.png config/includes.chroot/etc/calamares/branding/anatolx/welcome.png
          
          # 2. Selçuklu/Siber Duvar Kağıdı (.png)
          cp assets/58539.png config/includes.chroot/usr/share/backgrounds/anatolx/cyber-geo.png
          
          # 3. Tux Radar Duvar Kağıdı (.jpg - ekran görüntüsüne göre)
          cp assets/IMG-20260506-WA0002.jpg config/includes.chroot/usr/share/backgrounds/anatolx/tux-radar.jpg
          
          # 4. Dağıtım Logosu (.png)
          cp assets/anatol-x-logo.png config/includes.chroot/etc/calamares/branding/anatolx/icon.png
          cp assets/anatol-x-logo.png config/includes.chroot/usr/share/pixmaps/anatolx-logo.png
          
      - name: Paket Adlarını Doğrula (hızlı ön kontrol)
        run: |
          # 20+ dakikalık derlemeden ÖNCE tüm paket adlarını Debian arşivine
          # karşı doğrular. "E: Unable to locate package ..." hatası artık
          # derlemenin en başında, hangi paket olduğu açıkça yazılarak yakalanır.
          # Ağ erişimi yoksa kontrol atlanır (sert hata değil).
          set -e
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/lists/partial" "$tmp/cache/archives/partial" "$tmp/dpkg" "$tmp/apt.conf.d"
          : > "$tmp/dpkg/status"

          # İzole APT yapılandırması: çalışan sistemin APT durumuna dokunmaz.
          cat > "$tmp/sources.list" <<EOF
          deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          EOF
          cat > "$tmp/apt.conf" <<EOF
          Dir::State::lists "$tmp/lists";
          Dir::State::status "$tmp/dpkg/status";
          Dir::Cache "$tmp/cache";
          Dir::Etc::sourcelist "$tmp/sources.list";
          Dir::Etc::sourceparts "-";
          Dir::Etc::main "$tmp/apt.conf";
          Dir::Etc::parts "$tmp/apt.conf.d";
          EOF
          export APT_CONFIG="$tmp/apt.conf"

          # DİKKAT: apt-get update, tüm indirmeler başarısız olsa bile 0 döner.
          # Bu yüzden gerçekten paket indeksi indi mi diye lists/ içeriğine bakılır.
          apt-get -o APT::Get::List-Cleanup="0" update || true
          if ! ls "$tmp"/lists/*_Packages* >/dev/null 2>&1; then
            echo "UYARI: Debian paket indeksi indirilemedi; doğrulama atlandı." >&2
            echo "UYARI: (Ağ erişimi yok — derleme yine de devam ediyor.)" >&2
            exit 0
          fi

          sh scripts/check-packages.sh

      - name: ISO'yu Derle
        run: |
          sudo lb config
          sudo lb build

      - name: SourceForge'a Rsync ile Aktar (2GB+ Desteği)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          
          # Boyut sınırlarına takılmadan güvenli aktarım
          rsync -e "ssh -i ~/.ssh/id_rsa" -avP live-image-amd64.hybrid.iso ${{ secrets.SF_USERNAME }}@frs.sourceforge.net:/home/frs/project/anatolialabs/Alpha-2.2/Anatol-X-Alpha-2.2.iso
